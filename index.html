      </div>
      <div class="mb-3 hidden flex-wrap gap-2" data-polybar>
        <button class="rounded-lg px-3 py-2 text-sm font-medium border" data-addtoggle>Add points: off</button>
        <button class="rounded-lg border border-red-200 bg-white px-3 py-2 text-sm font-medium text-red-600 disabled:opacity-40" data-delpoint disabled>Delete point</button>
        <button class="rounded-lg border border-stone-300 bg-white px-3 py-2 text-sm font-medium" data-undo>Undo last point</button>
      </div>
      <div class="relative mx-auto select-none touch-none" data-stage style="display:inline-block;max-width:100%">
        <img data-img src="${imgUrl}" class="block max-w-full rounded-xl" draggable="false" />
        <svg class="pointer-events-none absolute inset-0 h-full w-full" data-svg></svg>
        <div class="absolute inset-0" data-click style="cursor:crosshair;touch-action:none"></div>
      </div>
      <p class="mt-2 text-xs text-stone-500" data-hint></p>
      <div class="mt-4 rounded-xl bg-white p-3 shadow-sm">
        <div class="flex flex-col gap-2">
          <input type="text" placeholder="Label (e.g., exterior, loop)" class="rounded-md border border-stone-300 px-2 py-1 text-sm" data-label />
          <select class="rounded-md border border-stone-300 px-2 py-1 text-sm" data-role>
            <option value="">Role (optional)</option>
            <option>loop</option><option>tail</option><option>knot</option><option>center</option>
            <option>exterior</option><option>lining</option><option>contrast</option>
          </select>
          <div class="flex gap-2">
            <button class="flex-1 rounded-lg border border-stone-300 bg-white px-3 py-2 text-sm font-medium" data-reset>Reset</button>
            <button class="flex-1 rounded-lg bg-stone-900 px-3 py-2 text-sm font-medium text-white" data-save>${editingRegion ? "Save changes" : "Save region"}</button>
          </div>
        </div>
      </div>
    </div>
  `;

  const imgEl = main.querySelector("[data-img]");
  const svg = main.querySelector("[data-svg]");
  const clickLayer = main.querySelector("[data-click]");
  const hint = main.querySelector("[data-hint]");
  const modeBar = main.querySelector("[data-modebar]");
  const polyBar = main.querySelector("[data-polybar]");
  const modeRectBtn = main.querySelector('[data-mode="rect"]');
  const modePolyBtn = main.querySelector('[data-mode="poly"]');
  const addToggle = main.querySelector("[data-addtoggle]");
  const delPointBtn = main.querySelector("[data-delpoint]");
  const undoBtn = main.querySelector("[data-undo]");
  const labelInput = main.querySelector("[data-label]");
  const roleSelect = main.querySelector("[data-role]");

  // ---- State (all coordinates normalized 0..1 in image space) ----
  let mode = "rect";
  let rect = null;                 // committed rectangle, always editable
  let rectDrag = null;             // active rect edit drag, or the initial draw drag
  let drawingRect = null;          // {startX,startY} while first drawing a rectangle
  let polyPoints = [];             // committed polygon points
  let polyClosed = false;
  let addMode = false;             // polygon: tapping adds points
  let selectedPoint = -1;          // polygon: selected vertex index
  let pointDrag = null;            // {index} while dragging an existing vertex
  let pending = null;              // polygon placement in progress: {x,y} not yet committed

  const mag = createMagnifier({ imgEl, zoom: 3, size: 130 });

  const toNorm = (e) => {
    const r = imgEl.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) / r.width,
      y: (e.clientY - r.top) / r.height,
      inside: e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom,
    };
  };
  const clamp01 = (v) => Math.max(0, Math.min(1, v));

  // Prefill when editing a saved region
  if (editingRegion) {
    labelInput.value = editingRegion.label || "";
    roleSelect.value = editingRegion.role || "";
    const s = editingRegion.shape;
    if (s.type === "rect") { mode = "rect"; rect = { ...s.rect }; }
    else { mode = "poly"; polyPoints = s.points.map(p => ({ ...p })); polyClosed = true; }
    // Shape type can't change when re-editing
    modeBar.classList.add("hidden");
  }

  const updateUI = () => {
    const active = "bg-stone-900 text-white border-stone-900";
    const inactive = "bg-white text-stone-700 border-stone-300";
    modeRectBtn.className = `flex-1 rounded-lg px-3 py-2 text-sm font-medium border ${mode === 'rect' ? active : inactive}`;
    modePolyBtn.className = `flex-1 rounded-lg px-3 py-2 text-sm font-medium border ${mode === 'poly' ? active : inactive}`;
    polyBar.classList.toggle("hidden", mode !== "poly");
    polyBar.classList.toggle("flex", mode === "poly");
    addToggle.className = `rounded-lg px-3 py-2 text-sm font-medium border ${addMode ? active : inactive}`;
    addToggle.textContent = addMode ? "Add points: ON" : "Add points: off";
    delPointBtn.disabled = selectedPoint < 0;
    if (mode === "rect") {
      hint.textContent = rect
        ? "Drag the corners or edges to resize, or drag inside the box to move it."
        : "Drag on the image to draw a rectangle.";
    } else if (!polyClosed && polyPoints.length < 3) {
      hint.textContent = "Press and hold to position a point (the loupe helps), then lift your finger to place it. Close the shape by placing a point on the first one, or press Enter.";
    } else if (addMode) {
      hint.textContent = "Add points is ON. Press, fine-tune, and lift to add. A point placed near an edge is inserted into that edge.";
    } else {
      hint.textContent = "Drag any point to move it. Tap a point to select it, then use Delete point. Turn on Add points to insert more.";
    }
  };

  const redraw = () => {
    const r = imgEl.getBoundingClientRect();
    svg.setAttribute("viewBox", `0 0 ${r.width} ${r.height}`);
    let html = "";
    if (mode === "rect" && rect) {
      const x = rect.x * r.width, y = rect.y * r.height, w = rect.w * r.width, h = rect.h * r.height;
      html += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="rgba(234,88,12,0.25)" stroke="rgb(234,88,12)" stroke-width="2"/>`;
      const corners = [[x,y],[x+w,y],[x,y+h],[x+w,y+h]];
      for (const [cx, cy] of corners) html += `<rect x="${cx-8}" y="${cy-8}" width="16" height="16" rx="3" fill="white" stroke="rgb(234,88,12)" stroke-width="2"/>`;
      const mids = [[x+w/2,y],[x+w/2,y+h],[x,y+h/2],[x+w,y+h/2]];
      for (const [cx, cy] of mids) html += `<rect x="${cx-6}" y="${cy-6}" width="12" height="12" rx="2" fill="white" stroke="rgb(234,88,12)" stroke-width="2"/>`;
    } else if (mode === "poly" && polyPoints.length > 0) {
      const pts = polyPoints.map(p => `${p.x * r.width},${p.y * r.height}`).join(" ");
      if (polyClosed || polyPoints.length >= 3) {
        html += `<polygon points="${pts}" fill="rgba(234,88,12,0.25)" stroke="rgb(234,88,12)" stroke-width="2"/>`;
      } else {
        html += `<polyline points="${pts}" fill="none" stroke="rgb(234,88,12)" stroke-width="2"/>`;
      }
      for (let i = 0; i < polyPoints.length; i++) {
        const p = polyPoints[i];
        const sel = i === selectedPoint;
        html += `<circle cx="${p.x * r.width}" cy="${p.y * r.height}" r="${sel ? 9 : (i === 0 ? 7 : 6)}" fill="${sel ? 'rgb(239,68,68)' : 'white'}" stroke="${sel ? 'white' : 'rgb(234,88,12)'}" stroke-width="2"/>`;
      }
    }
    // Pending polygon point preview (not committed yet)
    if (mode === "poly" && pending) {
      const px = pending.x * r.width, py = pending.y * r.height;
      if (polyPoints.length > 0 && !polyClosed) {
        const last = polyPoints[polyPoints.length - 1];
        html += `<line x1="${last.x * r.width}" y1="${last.y * r.height}" x2="${px}" y2="${py}" stroke="rgb(234,88,12)" stroke-width="1.5" stroke-dasharray="4 3"/>`;
      }
      html += `<line x1="${px-10}" y1="${py}" x2="${px+10}" y2="${py}" stroke="black" stroke-width="1"/>`;
      html += `<line x1="${px}" y1="${py-10}" x2="${px}" y2="${py+10}" stroke="black" stroke-width="1"/>`;
      html += `<circle cx="${px}" cy="${py}" r="4" fill="none" stroke="rgb(234,88,12)" stroke-width="1.5"/>`;
    }
    svg.innerHTML = html;
  };

  const refresh = () => { updateUI(); redraw(); };

  const resetShape = () => {
    rect = null; polyPoints = []; polyClosed = false; selectedPoint = -1;
    pending = null; addMode = false; rectDrag = null; drawingRect = null; pointDrag = null;
    mag.hide(); refresh();
  };
  const setMode = (m) => { mode = m; resetShape(); };
  modeRectBtn.addEventListener("click", () => { if (!editingRegion) setMode("rect"); });
  modePolyBtn.addEventListener("click", () => { if (!editingRegion) setMode("poly"); });

  window.addEventListener("resize", redraw);
  imgEl.addEventListener("load", refresh);
  if (imgEl.complete && imgEl.naturalWidth) refresh();

  // ---------- Hit testing ----------
  const hitRadiusPx = 18;
  const hitPoint = (n) => {
    const r = imgEl.getBoundingClientRect();
    let best = -1, bestD = hitRadiusPx;
    polyPoints.forEach((p, i) => {
      const d = Math.hypot((p.x - n.x) * r.width, (p.y - n.y) * r.height);
      if (d < bestD) { bestD = d; best = i; }
    });
    return best;
  };
  const hitRectHandle = (n) => {
    if (!rect) return null;
    const r = imgEl.getBoundingClientRect();
    const px = (v, dim) => v * dim;
    const l = px(rect.x, r.width), rr = px(rect.x + rect.w, r.width);
    const t = px(rect.y, r.height), b = px(rect.y + rect.h, r.height);
    const x = n.x * r.width, y = n.y * r.height;
    const tol = 16;
    const nearL = Math.abs(x - l) < tol, nearR = Math.abs(x - rr) < tol;
    const nearT = Math.abs(y - t) < tol, nearB = Math.abs(y - b) < tol;
    const inX = x > l - tol && x < rr + tol, inY = y > t - tol && y < b + tol;
    if (nearL && nearT) return "nw";
    if (nearR && nearT) return "ne";
    if (nearL && nearB) return "sw";
    if (nearR && nearB) return "se";
    if (nearT && inX) return "n";
    if (nearB && inX) return "s";
    if (nearL && inY) return "w";
    if (nearR && inY) return "e";
    if (x > l && x < rr && y > t && y < b) return "move";
    return null;
  };
  // Distance from a point to a segment (in screen pixels) and the projected position
  const nearestEdge = (n) => {
    const r = imgEl.getBoundingClientRect();
    const px = n.x * r.width, py = n.y * r.height;
    let best = { idx: -1, d: Infinity };
    const count = polyPoints.length;
    for (let i = 0; i < count; i++) {
      const a = polyPoints[i], b = polyPoints[(i + 1) % count];
      if (!polyClosed && i === count - 1) break;
      const ax = a.x * r.width, ay = a.y * r.height, bx = b.x * r.width, by = b.y * r.height;
      const dx = bx - ax, dy = by - ay;
      const len2 = dx * dx + dy * dy || 1;
      const t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / len2));
      const d = Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
      if (d < best.d) best = { idx: i, d };
    }
    return best;
  };

  // ---------- Pointer handling ----------
  clickLayer.addEventListener("pointerdown", (e) => {
    const n = toNorm(e);
    clickLayer.setPointerCapture?.(e.pointerId);

    if (mode === "rect") {
      e.preventDefault();
      const handle = hitRectHandle(n);
      if (rect && handle) {
        rectDrag = { type: handle, startX: e.clientX, startY: e.clientY, startRect: { ...rect } };
        if (handle !== "move") {
          const t = rectHandleTarget(handle, rect, n.x, n.y);
          mag.show(); mag.update(e.clientX, e.clientY, t.x, t.y, { lines: boxOverlayLines(rect) });
        }
      } else if (!rect) {
        drawingRect = { startX: clamp01(n.x), startY: clamp01(n.y) };
        rect = { x: drawingRect.startX, y: drawingRect.startY, w: 0, h: 0 };
        mag.show(); mag.update(e.clientX, e.clientY, clamp01(n.x), clamp01(n.y), null);
        refresh();
      }
      return;
    }

    // ---- Polygon ----
    e.preventDefault();
    const hit = hitPoint(n);
    if (!addMode && hit >= 0 && (polyClosed || polyPoints.length >= 1)) {
      // Start dragging an existing vertex and select it
      selectedPoint = hit;
      pointDrag = { index: hit };
      const p = polyPoints[hit];
      mag.show(); mag.update(e.clientX, e.clientY, p.x, p.y, { polygon: polyPointsForLoupe() });
      refresh();
      return;
    }
    // Begin a placement. Nothing is committed until the finger is lifted.
    pending = { x: clamp01(n.x), y: clamp01(n.y) };
    mag.show(); mag.update(e.clientX, e.clientY, pending.x, pending.y, { polygon: polyPointsForLoupe(pending) });
    redraw();
  });

  const rectHandleTarget = (type, rc, pnx, pny) => {
    const l = rc.x, r = rc.x + rc.w, t = rc.y, b = rc.y + rc.h;
    const cx = Math.max(l, Math.min(r, pnx)), cy = Math.max(t, Math.min(b, pny));
    if (type === "nw") return { x: l, y: t };
    if (type === "ne") return { x: r, y: t };
    if (type === "sw") return { x: l, y: b };
    if (type === "se") return { x: r, y: b };
    if (type === "n") return { x: cx, y: t };
    if (type === "s") return { x: cx, y: b };
    if (type === "w") return { x: l, y: cy };
    return { x: r, y: cy };
  };

  // Polyline of existing points (+ optional pending point) to draw inside the loupe
  function polyPointsForLoupe(extra) {
    const pts = polyPoints.map(p => ({ x: p.x, y: p.y }));
    if (extra && !polyClosed) pts.push({ x: extra.x, y: extra.y });
    return pts;
  }

  clickLayer.addEventListener("pointermove", (e) => {
    const n = toNorm(e);

    if (mode === "rect") {
      if (drawingRect) {
        const x = clamp01(n.x), y = clamp01(n.y);
        rect = {
          x: Math.min(drawingRect.startX, x),
          y: Math.min(drawingRect.startY, y),
          w: Math.abs(x - drawingRect.startX),
          h: Math.abs(y - drawingRect.startY),
        };
        mag.update(e.clientX, e.clientY, x, y, { lines: boxOverlayLines(rect) });
        refresh();
      } else if (rectDrag) {
        const r = imgEl.getBoundingClientRect();
        const dx = (e.clientX - rectDrag.startX) / r.width, dy = (e.clientY - rectDrag.startY) / r.height;
        const res = applyBoxDrag(rectDrag, dx, dy, n.x, n.y);
        rect = res.rect;
        if (res.target) { mag.show(); mag.update(e.clientX, e.clientY, res.target.x, res.target.y, { lines: boxOverlayLines(rect) }); }
        refresh();
      }
      return;
    }

    // ---- Polygon ----
    if (pointDrag) {
      const x = clamp01(n.x), y = clamp01(n.y);
      polyPoints[pointDrag.index] = { x, y };
      mag.update(e.clientX, e.clientY, x, y, { polygon: polyPointsForLoupe() });
      redraw();
    } else if (pending) {
      pending = { x: clamp01(n.x), y: clamp01(n.y) };
      pending.outside = !n.inside;
      mag.update(e.clientX, e.clientY, pending.x, pending.y, { polygon: polyPointsForLoupe(pending) });
      redraw();
    }
  });

  const finishPointer = (e, cancelled) => {
    if (mode === "rect") {
      if (drawingRect) {
        drawingRect = null;
        if (!rect || rect.w < 0.01 || rect.h < 0.01) rect = null; // ignore accidental taps
      }
      rectDrag = null;
      mag.hide(); refresh();
      return;
    }

    // ---- Polygon ----
    if (pointDrag) {
      pointDrag = null;
      mag.hide(); refresh();
      return;
    }
    if (pending) {
      const p = pending;
      pending = null;
      mag.hide();
      // Dragging off the image before lifting cancels the placement
      if (cancelled || p.outside) { refresh(); return; }
      commitPoint(p);
    }
  };
  clickLayer.addEventListener("pointerup", (e) => finishPointer(e, false));
  clickLayer.addEventListener("pointercancel", (e) => finishPointer(e, true));

  function commitPoint(p) {
    const r = imgEl.getBoundingClientRect();
    // Closing: placing a point on the first vertex closes an open shape
    if (!polyClosed && polyPoints.length >= 3) {
      const first = polyPoints[0];
      if (Math.hypot((p.x - first.x) * r.width, (p.y - first.y) * r.height) < 16) {
        polyClosed = true; selectedPoint = -1; refresh(); return;
      }
    }
    if (polyClosed && !addMode) { refresh(); return; }

    if (polyClosed && addMode) {
      // Insert into the nearest edge
      const edge = nearestEdge(p);
      if (edge.idx >= 0) {
        polyPoints.splice(edge.idx + 1, 0, { x: p.x, y: p.y });
        selectedPoint = edge.idx + 1;
      }
    } else if (addMode && polyPoints.length >= 3) {
      // Open shape in add mode: insert on nearest edge if close, else append
      const edge = nearestEdge(p);
      if (edge.idx >= 0 && edge.d < 20) {
        polyPoints.splice(edge.idx + 1, 0, { x: p.x, y: p.y });
        selectedPoint = edge.idx + 1;
      } else {
        polyPoints.push({ x: p.x, y: p.y });
        selectedPoint = polyPoints.length - 1;
      }
    } else {
      polyPoints.push({ x: p.x, y: p.y });
      selectedPoint = polyPoints.length - 1;
    }
    refresh();
  }

  // Polygon controls
  addToggle.addEventListener("click", () => {
    if (polyPoints.length < 3 && !polyClosed) { addMode = false; }
    else addMode = !addMode;
    refresh();
  });
  delPointBtn.addEventListener("click", () => {
    if (selectedPoint < 0) return;
    if (polyPoints.length <= 3 && polyClosed) { alert("A polygon needs at least 3 points."); return; }
    polyPoints.splice(selectedPoint, 1);
    selectedPoint = -1;
    if (polyPoints.length < 3) polyClosed = false;
    refresh();
  });
  undoBtn.addEventListener("click", () => {
    if (polyClosed) polyClosed = false;
    else polyPoints.pop();
    selectedPoint = -1;
    refresh();
  });

  clickLayer.addEventListener("contextmenu", (e) => { if (mode === "poly") e.preventDefault(); });

  const keyHandler = (e) => {
    if (mode !== "poly") return;
    if (e.key === "Enter" && polyPoints.length >= 3) { polyClosed = true; selectedPoint = -1; refresh(); }
    else if (e.key === "Backspace" && document.activeElement?.tagName !== "INPUT") {
      if (selectedPoint >= 0 && polyPoints.length > 3) { polyPoints.splice(selectedPoint, 1); selectedPoint = -1; }
      else if (polyClosed) polyClosed = false;
      else polyPoints.pop();
      refresh();
    }
  };
  window.addEventListener("keydown", keyHandler);

  const cleanup = () => {
    mag.destroy();
    window.removeEventListener("keydown", keyHandler);
    window.removeEventListener("hashchange", cleanup);
  };
  window.addEventListener("hashchange", cleanup);

  main.querySelector("[data-reset]").addEventListener("click", () => {
    if (editingRegion) {
      // Restore the originally saved shape
      const s = editingRegion.shape;
      resetShape();
      if (s.type === "rect") rect = { ...s.rect };
      else { polyPoints = s.points.map(p => ({ ...p })); polyClosed = true; }
      refresh();
    } else resetShape();
  });

  // ---------- Save ----------
  main.querySelector("[data-save]").addEventListener("click", async () => {
    const w = itemImg.naturalWidth, h = itemImg.naturalHeight;
    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "black"; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = "white";

    let ok = false, shape = null;
    if (mode === "rect" && rect && rect.w > 0.005 && rect.h > 0.005) {
      ctx.fillRect(rect.x * w, rect.y * h, rect.w * w, rect.h * h);
      shape = { type: "rect", rect: { ...rect } };
      ok = true;
    } else if (mode === "poly" && polyPoints.length >= 3) {
      ctx.beginPath();
      polyPoints.forEach((p, i) => {
        const px = p.x * w, py = p.y * h;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      });
      ctx.closePath(); ctx.fill();
      shape = { type: "poly", points: polyPoints.map(p => ({ ...p })) };
      ok = true;
    }
    if (!ok) { alert("Draw a shape first."); return; }

    const idata = ctx.getImageData(0, 0, w, h);
    let minX = w, minY = h, maxX = 0, maxY = 0, area = 0;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (idata.data[(y * w + x) * 4] > 128) {
        if (x < minX) minX = x; if (y < minY) minY = y;
        if (x > maxX) maxX = x; if (y > maxY) maxY = y;
        area++;
      }
    }
    const bbox = area > 0 ? [minX, minY, maxX - minX, maxY - minY] : [0, 0, 0, 0];
    const blob = await new Promise(res => canvas.toBlob(res, "image/png"));

    if (editingRegion) {
      // Overwrite the existing mask blob and update the region in place
      await putBlob(editingRegion.maskBlobKey, blob);
      editingRegion.bbox = bbox;
      editingRegion.areaPx = area;
      editingRegion.shape = shape;
      editingRegion.label = labelInput.value.trim() || editingRegion.label;
      editingRegion.role = roleSelect.value || null;
    } else {
      const newId = uid();
      const maskKey = `item-${item.id}-mask-${newId}`;
      await putBlob(maskKey, blob);
      item.regions = [...(item.regions || []), {
        id: newId,
        label: labelInput.value.trim() || `Region ${(item.regions || []).length + 1}`,
        maskBlobKey: maskKey, bbox, areaPx: area,
        role: roleSelect.value || null,
        source: "manual",
        shape,
      }];
    }
    item.updatedAt = Date.now();
    await putItem(item);
    cleanup();
    navigate(`#/items/${item.id}`);
  });

  refresh();
}

route("/items/:id/manual-region", (main, params) => manualRegionPage(main, params));
route("/items/:id/manual-region/:regionId", (main, params) => manualRegionPage(main, params));

// ---------- Try fabrics ----------
route("/items/:id/try", async (main, { id }) => {
  const item = await getItem(id);
  if (!item) { main.innerHTML = `<div class="p-6">Item not found.</div>`; return; }
  if (!item.calibration) { main.innerHTML = `<div class="p-6">Item has no calibration.</div>`; return; }
  if (!(item.regions || []).length) { main.innerHTML = `<div class="p-6">Item has no regions. Segment it first.</div>`; return; }

  const imgUrl = await getBlobURL(item.imageBlobKey);
  const { img: itemImg } = await loadImage(imgUrl);
  const fabrics = await listFabrics();

  main.innerHTML = `
    <div class="mx-auto max-w-6xl p-6">
      <div class="mb-4 flex items-center justify-between gap-3">
        <h1 class="text-2xl font-semibold truncate">Try fabrics · ${esc(item.name)}</h1>
        <div class="flex gap-2">
          <button class="rounded-lg border border-stone-300 bg-white px-3 py-2 text-sm font-medium" data-export>Export PNG</button>
          <a href="#/items/${item.id}" class="rounded-lg border border-stone-300 bg-white px-3 py-2 text-sm font-medium">Done</a>
        </div>
      </div>
      <div class="grid gap-4 md:grid-cols-[1fr_340px]">
        <div class="try-stage">
          <canvas data-canvas></canvas>
        </div>
        <div class="flex flex-col gap-3" data-sidebar></div>
      </div>
      ${fabrics.length === 0 ? `<div class="mt-4 rounded-md bg-amber-50 p-3 text-sm text-amber-800">You don't have any fabrics yet. <a href="#/fabrics/new" class="underline font-medium">Add one</a> to start swapping.</div>` : ""}
      ${item.regions.length > MAX_REGIONS ? `<div class="mt-4 rounded-md bg-amber-50 p-3 text-sm text-amber-800">This item has more than ${MAX_REGIONS} regions. Only the first ${MAX_REGIONS} can be swapped at once.</div>` : ""}
    </div>
  `;

  const canvas = main.querySelector("[data-canvas]");
  const sidebar = main.querySelector("[data-sidebar]");
  const renderer = new FabricSwapRenderer(canvas);
  renderer.setItem(itemImg);

  // Only the first MAX_REGIONS regions can be swapped in a single render
  const swappable = item.regions.slice(0, MAX_REGIONS);

  // Precompute per-region data: feathered mask + low-frequency lighting map
  const regionData = [];
  for (const reg of swappable) {
    const maskBlob = await getBlob(reg.maskBlobKey);
    const maskUrl = URL.createObjectURL(maskBlob);
    const { img: maskImg } = await loadImage(maskUrl);
    const feathered = featherMask(maskImg, 1.5);
    const fblob = await new Promise(res => feathered.toBlob(res, "image/png"));
    const fUrl = URL.createObjectURL(fblob);
    const { img: fimg } = await loadImage(fUrl);
    const bbox = maskBoundingBox(maskImg);
    const lowFreqCanvas = buildLowFreqLighting(itemImg, bbox);
    const lowFreqMean = computeLowFreqMean(lowFreqCanvas, maskImg);
    regionData.push({ featheredImg: fimg, lowFreqCanvas, lowFreqMean });
    URL.revokeObjectURL(maskUrl);
  }

  const assignments = swappable.map(() => ({
    fabricId: null,
    rotation: 0,
    offsetX: 0,
    offsetY: 0,
    scaleMult: 1,
    foldOn: true,
    foldStrength: 0.8,
    shadowsOnly: false,
    fabricImg: null,
  }));

  const colors = ["#ea580c","#2563eb","#16a34a","#9333ea","#db2777","#ca8a04"];

  // Map region index to the compact index the renderer uses (only assigned regions are rendered)
  const indexInRenderer = (itemRegionIndex) => {
    let count = 0;
    for (let i = 0; i < itemRegionIndex; i++) {
      if (assignments[i].fabricId && assignments[i].fabricImg) count++;
    }
    return count;
  };

  const rebuildRegionsForRenderer = async () => {
    const list = [];
    for (let i = 0; i < swappable.length; i++) {
      const a = assignments[i];
      if (!a.fabricId || !a.fabricImg) continue;
      const fabric = fabrics.find(f => f.id === a.fabricId);
      list.push({
        fabricImg: a.fabricImg,
        maskImg: regionData[i].featheredImg,
        lowFreqCanvas: regionData[i].lowFreqCanvas,
        lowFreqMean: regionData[i].lowFreqMean,
        fabricPPI: fabric.calibration.pixelsPerInch,
        itemPPI: item.calibration.pixelsPerInch,
        rotation: a.rotation,
        offsetX: a.offsetX,
        offsetY: a.offsetY,
        scaleMult: a.scaleMult,
        foldOn: a.foldOn,
        foldStrength: a.foldStrength,
        shadowsOnly: a.shadowsOnly,
      });
    }
    await renderer.setRegions(list);
    renderer.draw();
  };

  const renderSidebar = () => {
    sidebar.innerHTML = "";
    swappable.forEach((reg, i) => {
      const a = assignments[i];
      const panel = el(`
        <div class="rounded-xl bg-white p-3 shadow-sm">
          <div class="mb-2 flex items-center gap-2">
            <div class="region-swatch" style="background:${colors[i % colors.length]}"></div>
            <div class="text-sm font-medium flex-1 truncate">${esc(reg.label || `Region ${i+1}`)}</div>
            ${reg.role ? `<span class="text-xs text-stone-500">${esc(reg.role)}</span>` : ""}
          </div>
          <div class="mb-2 text-xs font-medium text-stone-600">Fabric</div>
          <div class="mb-3 flex flex-wrap gap-1" data-fabrics></div>
          <div class="flex flex-col gap-2" data-controls></div>
          <div class="mt-3 rounded-md border border-stone-200 p-2">
            <label class="flex items-center gap-2 text-sm">
              <input type="checkbox" ${a.foldOn ? "checked" : ""} data-foldon />
              <span>Transfer folds from original</span>
            </label>
            <div class="mt-2 flex flex-col gap-2" data-foldcontrols></div>
          </div>
          <div class="mt-2 flex gap-2">
            <button class="flex-1 rounded-md border border-stone-300 bg-white px-2 py-1 text-xs" data-reset>Reset transform</button>
            <button class="flex-1 rounded-md border border-stone-300 bg-white px-2 py-1 text-xs" data-clear>Clear fabric</button>
          </div>
        </div>
      `);

      const fabricList = panel.querySelector("[data-fabrics]");
      fabrics.forEach(f => {
        const btn = el(`<button data-fid="${f.id}" title="${esc(f.name)}" class="relative"></button>`);
        getBlobURL(f.imageBlobKey).then(url => {
          if (url) btn.innerHTML = `<img src="${url}" class="fabric-pick ${a.fabricId === f.id ? 'selected' : ''}" />`;
        });
        btn.addEventListener("click", async () => {
          a.fabricId = f.id;
          const url = await getBlobURL(f.imageBlobKey);
          const { img: fimg } = await loadImage(url);
          a.fabricImg = fimg;
          await bumpUsage("fabric", f.id);
          renderSidebar();
          rebuildRegionsForRenderer();
        });
        fabricList.appendChild(btn);
      });

      const controls = panel.querySelector("[data-controls]");
      const addSlider = (parent, label, min, max, step, value, unit, onInput) => {
        const row = el(`
          <div class="slider-row">
            <label>${label}</label>
            <input type="range" min="${min}" max="${max}" step="${step}" value="${value}" />
            <span class="val">${value}${unit}</span>
          </div>
        `);
        const inp = row.querySelector("input");
        const val = row.querySelector(".val");
        inp.addEventListener("input", (e) => {
          const v = parseFloat(e.target.value);
          val.textContent = `${v}${unit}`;
          onInput(v);
        });
        parent.appendChild(row);
      };

      const rIdx = () => indexInRenderer(i);
      addSlider(controls, "Rotation", 0, 360, 1, a.rotation, "°", (v) => { a.rotation = v; renderer.updateRegion(rIdx(), { rotation: v }); });
      addSlider(controls, "Offset X", -500, 500, 1, a.offsetX, "", (v) => { a.offsetX = v; renderer.updateRegion(rIdx(), { offsetX: v }); });
      addSlider(controls, "Offset Y", -500, 500, 1, a.offsetY, "", (v) => { a.offsetY = v; renderer.updateRegion(rIdx(), { offsetY: v }); });
      addSlider(controls, "Scale", 0.5, 2, 0.01, a.scaleMult, "×", (v) => { a.scaleMult = v; renderer.updateRegion(rIdx(), { scaleMult: v }); });

      const snapRow = el(`<div class="mt-1 flex gap-1"></div>`);
      [0, 90, 180, 270].forEach(deg => {
        const b = el(`<button class="rounded-md border border-stone-300 bg-white px-2 py-1 text-xs">${deg}°</button>`);
        b.addEventListener("click", () => { a.rotation = deg; renderSidebar(); rebuildRegionsForRenderer(); });
        snapRow.appendChild(b);
      });
      controls.appendChild(snapRow);

      const foldCheckbox = panel.querySelector("[data-foldon]");
      const foldControls = panel.querySelector("[data-foldcontrols]");
      const renderFoldControls = () => {
        foldControls.innerHTML = "";
        if (!a.foldOn) return;
        addSlider(foldControls, "Strength", 0, 1.5, 0.05, a.foldStrength, "", (v) => {
          a.foldStrength = v; renderer.updateRegion(rIdx(), { foldStrength: v });
        });
        const toggle = el(`
          <div class="flex gap-1">
            <button class="flex-1 rounded-md border px-2 py-1 text-xs ${!a.shadowsOnly ? 'bg-stone-900 text-white border-stone-900' : 'bg-white border-stone-300'}" data-mode="both">Shadows + highlights</button>
            <button class="flex-1 rounded-md border px-2 py-1 text-xs ${a.shadowsOnly ? 'bg-stone-900 text-white border-stone-900' : 'bg-white border-stone-300'}" data-mode="shadows">Shadows only</button>
          </div>
        `);
        toggle.querySelector('[data-mode="both"]').addEventListener("click", () => { a.shadowsOnly = false; renderFoldControls(); renderer.updateRegion(rIdx(), { shadowsOnly: false }); });
        toggle.querySelector('[data-mode="shadows"]').addEventListener("click", () => { a.shadowsOnly = true; renderFoldControls(); renderer.updateRegion(rIdx(), { shadowsOnly: true }); });
        foldControls.appendChild(toggle);
      };
      foldCheckbox.addEventListener("change", (e) => {
        a.foldOn = e.target.checked;
        renderFoldControls();
        renderer.updateRegion(rIdx(), { foldOn: a.foldOn });
      });
      renderFoldControls();

      panel.querySelector("[data-reset]").addEventListener("click", () => {
        a.rotation = 0; a.offsetX = 0; a.offsetY = 0; a.scaleMult = 1;
        a.foldOn = true; a.foldStrength = 0.8; a.shadowsOnly = false;
        renderSidebar(); rebuildRegionsForRenderer();
      });
      panel.querySelector("[data-clear]").addEventListener("click", () => {
        a.fabricId = null; a.fabricImg = null;
        renderSidebar(); rebuildRegionsForRenderer();
      });

      sidebar.appendChild(panel);
    });
  };

  renderSidebar();
  renderer.draw();

  main.querySelector("[data-export]").addEventListener("click", async () => {
    const blob = await renderer.exportPNG();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${item.name.replace(/[^a-z0-9]+/gi, '_')}_fabricswap.png`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    await bumpUsage("item", item.id);
  });
});
</script>
</body>
</html>
